version: '3.3'

services:
  ibr-mocks:
    image: dci-ibr-mocks
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3333:3003" # IBR registry endpoints (search, enrolled, enrollment/updates, subscribe, txn/status, ...)
      - "3334:3004" # SP-MIS callback endpoints (on-search, notify, ...)
    extra_hosts:
      # lets the mock call back the test runner's listener (header.sender_uri)
      - "host.docker.internal:host-gateway"
    networks:
      - web

networks:
  web:
    driver: bridge
